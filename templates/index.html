<!DOCTYPE html>
<html lang="pl">
 <!-- Metadane strony, tytuł i podłączenie arkusza stylów. -->
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="#111827" name="theme-color"/>
  <title>
   Quiz
  </title>
  <link href="/static/style.css" rel="stylesheet"/>
 </head>
 <body>
  <!-- Główny panel aplikacji; zawiera ekran startowy, quiz i podsumowanie. -->
  <div class="card">
   <!-- Nagłówek z nazwą quizu oraz przyciskami motywu i dźwięku. -->
   <header class="top">
    <div class="logo-title">
     <span class="logo">
      📱
     </span>
     <div class="titles">
      <h1 data-i18n="title" id="main-title">
       Quiz o technologii
      </h1>
      <p id="db-info">
      </p>
     </div>
    </div>
    <div class="top-actions">
     <button class="small-btn" id="theme-btn" title="Motyw" type="button">
      🎨
     </button>
     <button class="small-btn" id="sound-btn" title="D&zacute;wi&eogon;k" type="button">
      🔊
     </button>
    </div>
   </header>
   <!-- Ekran konfiguracji: język, liczba pytań, kategoria, tryb i trudność. -->
<!-- Ekran startowy z dodaną sekcją logowania -->
<div id="start-screen">
  
<!-- W pełni przetłumaczalna sekcja logowania/rejestracji -->
<div id="auth-box">
  
  <!-- Wybierz język -->
  <div class="field-group" style="margin-bottom: 20px;">
    <p data-i18n="chooseLang">Wybierz język</p>
    <div class="lang">
      <button type="button" data-lang="pl" class="active">PL</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>

  <!-- Formularz Logowania -->
  <div id="login-view">
    <h2 data-i18n="loginTitle">Zaloguj się</h2>
    <div class="name-label">
      <input type="text" id="loginUser" data-i18n-placeholder="namePlaceholder" placeholder="Nazwa użytkownika" required>
      <input type="password" id="loginPass" data-i18n-placeholder="passwordPlaceholder" placeholder="Hasło" required>
    </div>
    <button type="button" id="login-submit-btn" data-i18n="loginBtn">Zaloguj</button>
    <p style="margin-top:15px; font-size:13px; color:var(--muted);">
      <span data-i18n="noAccount">Nie masz konta? </span><a href="#" id="go-to-signup" data-i18n="registerLink" style="color:var(--accent1);">Zarejestruj się</a>
    </p>
  </div>

  <!-- Formularz Rejestracji -->
  <div id="signup-view" hidden>
    <h2 data-i18n="signupTitle">Stwórz konto</h2>
    <div class="name-label">
      <input type="text" id="signupUser" data-i18n-placeholder="namePlaceholder" placeholder="Wybierz login" required>
      <input type="password" id="signupPass" data-i18n-placeholder="passwordPlaceholder" placeholder="Wybierz hasło" required>
    </div>
    <button type="button" id="signup-submit-btn" data-i18n="signupBtn">Zarejestruj</button>
    <p style="margin-top:15px; font-size:13px; color:var(--muted);">
      <span data-i18n="haveAccount">Masz już konto? </span><a href="#" id="go-to-login" data-i18n="loginLink" style="color:var(--accent1);">Zaloguj się</a>
    </p>
  </div>
</div>
  <!-- UKRYTA KONFIGURACJA QUIZU (Pokaże się po zalogowaniu) -->
  <div id="quiz-config-view" style="display:none; width:100%; flex-direction:column; align-items:center; gap:17px;">
    <div id="quiz-picker" class="field-group">
      <p data-i18n="chooseQuiz"></p>
      <div id="quiz-buttons" class="choices"></div>
    </div>
    
    <div class="field-group">
      <p data-i18n="choosePack"></p>
      <div id="pack-buttons" class="choices"></div>
    </div>

    <div class="field-group">
      <p data-i18n="chooseCategory"></p>
      <div id="category-buttons" class="choices"></div>
    </div>

    <div class="field-group">
      <p data-i18n="chooseMode"></p>
      <div class="choices">
        <button type="button" data-mode="classic" class="active" data-i18n="classic"></button>
        <button type="button" data-mode="survival" data-i18n="survival"></button>
        <button type="button" data-mode="blitz" data-i18n="blitz"></button>
        <button type="button" data-mode="duel" data-i18n="duel"></button>
        <button type="button" data-mode="daily" data-i18n="daily"></button>
      </div>
    </div>

    <div id="players-config" class="player-config" hidden>
      <label>
        <span data-i18n="player1"></span>
        <input type="text" id="player1-name" value="">
      </label>
      <label>
        <span data-i18n="player2"></span>
        <input type="text" id="player2-name" value="">
      </label>
    </div>

    <div class="field-group">
      <p data-i18n="chooseDifficulty"></p>
      <div class="choices">
        <button type="button" data-difficulty="easy" data-i18n="easy"></button>
        <button type="button" data-difficulty="medium" class="active" data-i18n="medium"></button>
        <button type="button" data-difficulty="hard" data-i18n="hard"></button>
      </div>
    </div>

    <button type="button" id="start-btn" data-i18n="start"></button>
  </div>

</div>
   <!-- Ekran rozgrywki: pasek postępu, zegar, koła ratunkowe i odpowiedzi. -->
   <section hidden="" id="quiz">
    <div class="quiz-toolbar">
     <span id="mode-label">
     </span>
     <button data-i18n="pause" id="pause-btn" type="button">
      ⏸ Pauza
     </button>
    </div>
    <div class="bar">
     <div id="bar-fill">
     </div>
    </div>
    <p id="progress">
    </p>
    <div class="timer-row">
     <div class="timer">
      <div id="timer-fill">
      </div>
     </div>
     <span id="timer-text">
     </span>
    </div>
    <!-- Jednorazowe pomoce w trakcie gry. -->
    <div class="lifelines" id="lifelines">
     <button id="fifty-btn" type="button">
      🌓 50/50
     </button>
     <button id="time-btn" type="button">
      ⏱ +10 s
     </button>
    </div>
    <h2 id="question">
    </h2>
    <img alt="" hidden="" id="question-image"/>
    <div id="answers">
    </div>
    <p hidden="" id="feedback">
    </p>
    <p hidden="" id="explanation">
    </p>
    <div aria-live="polite" class="badge-live" id="badge-live">
    </div>
    <button hidden="" id="next" type="button">
    </button>
    <div hidden="" id="pause-screen">
     <h2 data-i18n="paused" id="pause-title">
      Pauza
     </h2>
     <button data-i18n="resume" id="resume-btn" type="button">
      ▶ Wzn&oacute;w
     </button>
     <button data-i18n="restart" id="restart-btn" type="button">
      &orarr; Wr&oacute;&cacute; do menu
     </button>
    </div>
   </section>
   <!-- Ekran końcowy: wynik, odznaki, zapis i ranking. -->
   <section hidden="" id="end">
    <div aria-hidden="true" id="confetti">
    </div>
    <h2 id="result">
    </h2>
    <div class="badges" id="badges">
    </div>
    <div hidden="" id="duel-result">
    </div>
    <label class="name-label">
     <span data-i18n="namePlaceholder">
      Twoje imi&eogon;
     </span>
     <input data-i18n-placeholder="namePlaceholder" id="name" maxlength="40" placeholder="Twoje imi&eogon;" hidden/>
    </label>
    <button data-i18n="save" id="save" type="button">
     Zapisz wynik
    </button>
    <button data-i18n="again" id="again" type="button">
     Zagraj jeszcze raz
    </button>
    <h3 id="rank-title">
    </h3>
    <div class="choices" id="rank-tabs">
    </div>
    <ol id="ranking">
    </ol>
   </section>
  </div>
  <!-- Logika gry znajduje się w pliku JavaScript. -->
  <script src="/static/script.js">
  </script>
 </body>
</html>
