<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Quiz</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="card">
  <h1>Quiz</h1>

<div id="quiz">
  <div class="bar"><div id="bar-fill"></div></div>
  <p id="progress"></p>
  <div class="timer"><div id="timer-fill"></div></div>
  <h2 id="question"></h2>
  <div id="answers"></div>
  <p id="explanation" hidden></p>
  <button id="next" hidden>Dalej →</button>
</div>

  <div id="end" hidden>
    <h2 id="result"></h2>
    <input id="name" placeholder="Twoje imię">
    <button id="save">Zapisz wynik</button>
    <button id="again" onclick="location.reload()">Zagraj jeszcze raz</button>
    <h3>Ranking</h3>
    <ol id="ranking"></ol>
  </div>
</div>
  <script src="/static/script.js"></script>
</body>
</html>
