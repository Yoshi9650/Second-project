<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Quiz</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Quiz</h1>

  <div id="quiz">
    <p id="progress"></p>
    <h2 id="question"></h2>
    <div id="answers"></div>
  </div>

  <div id="end" hidden>
    <h2 id="result"></h2>
    <input id="name" placeholder="Twoje imię">
    <button id="save">Zapisz wynik</button>
    <h3>Ranking</h3>
    <ol id="ranking"></ol>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
