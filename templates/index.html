<!DOCTYPE html>
<!-- Informuje przeglądarkę, że to dokument HTML5 -->
<html lang="pl">
<head>
  <!-- Kodowanie znaków: dzięki temu działają polskie litery -->
  <meta charset="UTF-8">
  <!-- Dopasowuje stronę do szerokości ekranu telefonu -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tytuł widoczny na karcie przeglądarki -->
  <title>Quiz</title>
  <!-- Podpięcie pliku ze stylami (wygląd strony) -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Karta: główny pojemnik, w którym leży cały quiz -->
  <div class="card">

    <!-- ===== NAGŁÓWEK: logo, tytuł, licznik pytań i przyciski języka ===== -->
    <div class="top">
      <div class="logo-title">
        <!-- Ikonka telefonu obok tytułu (poza h1, żeby gradient jej nie zamalował) -->
        <span class="logo">📱</span>
        <div class="titles">
          <!-- Tytuł: tekst wpisuje JS na podstawie data-i18n (zależnie od języka) -->
          <h1 data-i18n="title"></h1>
          <!-- Liczba pytań w bazie: wypełnia JS po pobraniu danych z Flaska -->
          <p id="db-info"></p>
    </div>
   </div>
   <!-- ===== EKRAN STARTOWY: wybór języka i przycisk Start ===== -->
   <div id="start-screen">
   <!-- Napis "Wybierz język" (tekst wpisuje JS przez data-i18n) -->
   <p id="lang-label" data-i18n="chooseLang"></p>
    <!-- Przyciski języka; data-lang mówi JS, który język wybrać -->
     <div class="lang">
      <button data-lang="pl">PL</button>
     <button data-lang="en">EN</button>
  </div>
  <!-- Przycisk rozpoczynający quiz -->
  <button id="start-btn" data-i18n="start"></button>
  <!-- Stopka ekranu startowego: autor i link do GitHuba -->
<div class="footer">
  <span>© Michał Kuczyński 2026</span>
  <!-- Zamień adres w href na link do swojego repozytorium -->
  <a id="github-link" href="https://github.com/Yoshi9650"
     target="_blank" rel="noopener noreferrer">GitHub</a>
</div>
</div>
    </div>

    <!-- ===== EKRAN QUIZU: widoczny podczas gry ===== -->
    <div id="quiz" hidden>
      <!-- Przycisk pauzy (podczas pauzy jest ukryty razem z resztą quizu) -->
      <button id="pause-btn" data-i18n="pause"></button>
      <!-- Pasek postępu quizu (zewnętrzny pasek + wypełnienie, którym steruje JS) -->
      <div class="bar"><div id="bar-fill"></div></div>
      <!-- Napis "Pytanie X z Y", punkty i seria -->
      <p id="progress"></p>

      <!-- Odliczanie czasu: pasek i liczba sekund obok niego -->
      <div class="timer-row">
        <div class="timer"><div id="timer-fill"></div></div>
        <span id="timer-text"></span>
      </div>

      <!-- Treść pytania (wpisuje JS) -->
      <h2 id="question"></h2>
      <!-- Tu JS tworzy przyciski z odpowiedziami A, B, C -->
      <div id="answers"></div>

      <!-- Komunikat po odpowiedzi ("Dobrze!", "Czas minął!"); hidden = ukryty na starcie -->
      <p id="feedback" hidden></p>
      <!-- Wyjaśnienie odpowiedzi (jeśli pytanie je ma) -->
      <p id="explanation" hidden></p>
      <!-- Przycisk przejścia do następnego pytania, pokazywany po odpowiedzi -->
      <button id="next" hidden></button>
      <!-- Ekran pauzy: widoczny tylko wtedy, gdy quiz jest wstrzymany -->
      <div id="pause-screen" hidden>
       <h2 id="pause-title" data-i18n="paused"></h2>
        <button id="resume-btn" data-i18n="resume"></button>
        <!-- Powrót do menu głównego (ekran startowy z wyborem języka) -->
        <button id="restart-btn" data-i18n="restart"></button>
      </div>
    </div>

    <!-- ===== EKRAN KOŃCOWY: ukryty, JS pokazuje go po ostatnim pytaniu ===== -->
    <div id="end" hidden>
      <!-- Wynik końcowy -->
      <h2 id="result"></h2>
      <!-- Pole na imię; data-i18n-placeholder = podpowiedź w polu zależna od języka -->
      <input id="name" data-i18n-placeholder="namePlaceholder">
      <!-- Zapis wyniku do rankingu -->
      <button id="save" data-i18n="save"></button>
      <!-- Rozpoczęcie quizu od nowa -->
      <button id="again" data-i18n="again"></button>

      <!-- Ranking: lista numerowana (ol), wiersze dodaje JS -->
      <h3 data-i18n="ranking"></h3>
      <ol id="ranking"></ol>
    </div>

  </div>
  <!-- Koniec karty -->

  <!-- Skrypt na końcu body, bo musi się wykonać, gdy wszystkie elementy już istnieją -->
  <script src="/static/script.js"></script>
</body>
</html>
