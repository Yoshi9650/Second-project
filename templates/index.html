<!DOCTYPE html>
<html lang="pl">
 <!-- Metadane strony, tytuł i podłączenie arkusza stylów. -->
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="#111827" name="theme-color"/>
  <title>
   Quiz
  </title>
  <link href="/static/style.css" rel="stylesheet"/>
 </head>
 <body>
  <!-- Główny panel aplikacji; zawiera ekran startowy, quiz i podsumowanie. -->
  <div class="card">
   <!-- Nagłówek z nazwą quizu oraz przyciskami motywu i dźwięku. -->
   <header class="top">
    <div class="logo-title">
     <span class="logo">
      📱
     </span>
     <div class="titles">
      <h1 data-i18n="title" id="main-title">
       Quiz o technologii
      </h1>
      <p id="db-info">
      </p>
     </div>
    </div>
    <div class="top-actions">
     <button class="small-btn" id="theme-btn" title="Motyw" type="button">
      🎨
     </button>
     <button class="small-btn" id="sound-btn" title="D&zacute;wi&eogon;k" type="button">
      🔊
     </button>
    </div>
   </header>
   <!-- Ekran konfiguracji: język, liczba pytań, kategoria, tryb i trudność. -->
   <section id="start-screen">
    <p data-i18n="chooseLang" id="lang-label">
     Wybierz j&eogon;zyk
    </p>
    <div class="lang">
     <button data-lang="pl" type="button">
      PL
     </button>
     <button data-lang="en" type="button">
      EN
     </button>
    </div>
    <div hidden="" id="quiz-picker">
     <p data-i18n="chooseQuiz">
      Wybierz quiz
     </p>
     <div class="choices" id="quiz-buttons">
     </div>
    </div>
    <div class="field-group">
     <p data-i18n="choosePack">
      Liczba pyta&nacute;
     </p>
     <div class="choices" id="pack-buttons">
     </div>
    </div>
    <div class="field-group">
     <p data-i18n="chooseCategory">
      Kategoria
     </p>
     <div class="choices" id="category-buttons">
     </div>
    </div>
    <div class="field-group">
     <p data-i18n="chooseMode">
      Tryb gry
     </p>
     <div class="choices" id="mode-buttons">
      <button class="active" data-mode="classic" type="button">
       Klasyczny
      </button>
      <button data-mode="survival" type="button">
       Przetrwanie
      </button>
      <button data-mode="blitz" type="button">
       Blitz 60 s
      </button>
      <button data-mode="duel" type="button">
       2 graczy
      </button>
      <button data-mode="daily" type="button">
       Dzienne wyzwanie
      </button>
     </div>
    </div>
    <div class="field-group">
     <p data-i18n="chooseDifficulty">
      Trudno&sacute;&cacute;
     </p>
     <div class="choices" id="difficulty-buttons">
      <button data-difficulty="easy" type="button">
       &Lstrok;atwy
      </button>
      <button class="active" data-difficulty="medium" type="button">
       &Sacute;redni
      </button>
      <button data-difficulty="hard" type="button">
       Trudny
      </button>
     </div>
    </div>
    <!-- Pola nazw graczy są pokazywane w trybie dla dwóch osób. -->
    <div class="player-config" hidden="" id="players-config">
     <label>
      <span data-i18n="player1">
       Gracz 1
      </span>
      <input id="player1-name" maxlength="24" placeholder="Gracz 1"/>
     </label>
     <label>
      <span data-i18n="player2">
       Gracz 2
      </span>
      <input id="player2-name" maxlength="24" placeholder="Gracz 2"/>
     </label>
    </div>
    <button data-i18n="start" id="start-btn" type="button">
     Start
    </button>
    <div class="footer">
     <span>
      &copy; Micha&lstrok; Kuczy&nacute;ski 2026
     </span>
     <a href="https://github.com/TWOJ-LOGIN/TWOJ-REPO" id="github-link" rel="noopener noreferrer" target="_blank">
      GitHub
     </a>
    </div>
   </section>
   <!-- Ekran rozgrywki: pasek postępu, zegar, koła ratunkowe i odpowiedzi. -->
   <section hidden="" id="quiz">
    <div class="quiz-toolbar">
     <span id="mode-label">
     </span>
     <button data-i18n="pause" id="pause-btn" type="button">
      ⏸ Pauza
     </button>
    </div>
    <div class="bar">
     <div id="bar-fill">
     </div>
    </div>
    <p id="progress">
    </p>
    <div class="timer-row">
     <div class="timer">
      <div id="timer-fill">
      </div>
     </div>
     <span id="timer-text">
     </span>
    </div>
    <!-- Jednorazowe pomoce w trakcie gry. -->
    <div class="lifelines" id="lifelines">
     <button id="fifty-btn" type="button">
      🌓 50/50
     </button>
     <button id="time-btn" type="button">
      ⏱ +10 s
     </button>
    </div>
    <h2 id="question">
    </h2>
    <img alt="" hidden="" id="question-image"/>
    <div id="answers">
    </div>
    <p hidden="" id="feedback">
    </p>
    <p hidden="" id="explanation">
    </p>
    <div aria-live="polite" class="badge-live" id="badge-live">
    </div>
    <button hidden="" id="next" type="button">
    </button>
    <div hidden="" id="pause-screen">
     <h2 data-i18n="paused" id="pause-title">
      Pauza
     </h2>
     <button data-i18n="resume" id="resume-btn" type="button">
      ▶ Wzn&oacute;w
     </button>
     <button data-i18n="restart" id="restart-btn" type="button">
      &orarr; Wr&oacute;&cacute; do menu
     </button>
    </div>
   </section>
   <!-- Ekran końcowy: wynik, odznaki, zapis i ranking. -->
   <section hidden="" id="end">
    <div aria-hidden="true" id="confetti">
    </div>
    <h2 id="result">
    </h2>
    <div class="badges" id="badges">
    </div>
    <div hidden="" id="duel-result">
    </div>
    <label class="name-label">
     <span data-i18n="namePlaceholder">
      Twoje imi&eogon;
     </span>
     <input data-i18n-placeholder="namePlaceholder" id="name" maxlength="40" placeholder="Twoje imi&eogon;"/>
    </label>
    <button data-i18n="save" id="save" type="button">
     Zapisz wynik
    </button>
    <button data-i18n="again" id="again" type="button">
     Zagraj jeszcze raz
    </button>
    <h3 id="rank-title">
    </h3>
    <div class="choices" id="rank-tabs">
    </div>
    <ol id="ranking">
    </ol>
   </section>
  </div>
  <!-- Logika gry znajduje się w pliku JavaScript. -->
  <script src="/static/script.js">
  </script>
 </body>
</html>
